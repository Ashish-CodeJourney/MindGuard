        <stop stop-color="#FF3B5C"/>
        <stop offset="1" stop-color="#4A1970"/>
      </linearGradient>
    </defs>
  </g>
  
  <!-- Text content -->
  <text x="340" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="58" fill="white" letter-spacing="-1">MindGuard</text>
  
  <text x="340" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="30" fill="white" opacity="0.7">Stop the scroll before it stops you.</text>
  
  <!-- Feature pills -->
  <g transform="translate(340, 380)">
