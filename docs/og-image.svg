<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0B10"/>
  
  <!-- Gradient orbs -->
  <ellipse cx="200" cy="180" rx="300" ry="200" fill="rgba(255,59,92,0.12)"/>
  <ellipse cx="1000" cy="500" rx="250" ry="180" fill="rgba(45,212,191,0.08)"/>
  
  <!-- Shield logo (left side) -->
  <g transform="translate(80, 180) scale(1.8)">
