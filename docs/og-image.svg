    <path d="M54 14L22 28V58C22 78 36 92 54 96C72 92 86 78 86 58V28Z" fill="white"/>
    <path d="M30 56L40 56L45 40L54 72L59 46L64 56L78 56" stroke="#4A1970" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <defs>
